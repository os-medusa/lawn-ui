[package]
name = "lawn-ui"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.91"
description = "Modern shadcn/ui design system for GPUI on top of gpui-base and gpui-fast"
repository = "https://github.com/os-medusa/lawn-ui"
readme = "README.md"
keywords = ["gpui", "gui", "ui", "shadcn", "design-system"]
categories = ["gui"]

[features]
default = ["chat"]
chat = []

[dependencies]
gpui = { package = "gpui-fast", version = "0.1.10", default-features = false, features = ["font-kit", "wayland", "windows-manifest"] }
gpui-fast-platform = "0.1.10"
gpui-base = { version = "0.8.0", default-features = false, features = ["gpui-fast"] }
gpui-kit-assets = { version = "0.8.0", default-features = false, features = ["gpui-fast"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
gpui-base = { version = "0.8.0", default-features = false, features = ["gpui-fast", "test-support"] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui-fast-platform = { version = "0.1.10", features = ["wayland"] }
